# ============================================
#  基础设置 — 这些你必须自己改
# ============================================
baseURL = "https://hangyahan.github.io/"
title = "涵舍"
theme = "LoveIt"

# 默认语言 — 你的内容以中文为主
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
hasCJKLanguage = true

enableRobotsTXT = true
enableEmoji = true

# 时区：上海。不设的话 Hugo 按 UTC 解释日期，凌晨发的帖子会被当成"未来"不渲染。
timezone = "Asia/Shanghai"

# ============================================
#  导航菜单 — 根据你的内容结构调整
# ============================================
[menu]
  [[menu.main]]
    weight = 1
    identifier = "archive"
    name = "Archive"
    url = "/archive/"
  [[menu.main]]
    weight = 2
    identifier = "about"
    name = "About"
    url = "/about/"
  [[menu.main]]
    weight = 3
    identifier = "curated"
    name = "Curated"
    url = "/curated/"
  [[menu.main]]
    weight = 4
    identifier = "utility"
    name = "Utility"
    url = "/utility/"

# ============================================
#  LoveIt 主题参数
# ============================================
[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "涵舍"
  description = "Keep learning. (◍•ᴗ•◍)"

  # --- 作者 ---
  [params.author]
    name = "HangYaHan"
    email = ""
    link = ""
    avatar = "https://avatars.githubusercontent.com/u/168107882?v=4"

  # --- 顶部导航栏 ---
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "涵舍"
      pre = ""
      post = "- 年轻的我对现实的恐怖一无所知。<br>- Too young too simple, sometimes naive.<br>"
      typeit = false

  # --- 底部 ---
  [params.footer]
    enable = true
    hugo = false
    copyright = true
    author = true
    since = 2025
    icp = ""
    license = ""

  # --- 搜索（Fuse.js，不需要外部服务）---
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = ""
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = false

  # --- 文章列表页（/posts/） ---
  [params.section]
    paginate = 100

  # --- 分类/标签列表页 ---
  [params.list]
    paginate = 50

  # --- 首页 ---
  [params.home]
    rss = 10
    # "Now" section — a one-line status update on the homepage
    # "此刻" — 首页的一行状态更新
    now = "📖 在读《共同基金常识》&nbsp;&nbsp;·&nbsp;&nbsp;🎓 准备秋招中"
    # Personal tags in sidebar / 侧栏个人标签
    tags = ["多愁善感", "孤独", "理工男", "游手好闲", "穷鬼"]
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "https://avatars.githubusercontent.com/u/168107882?v=4"
      title = ""
      subtitle = ""
      typeit = true
      social = true
      disclaimer = ""
    [params.home.posts]
      enable = true
      paginate = 6

  # --- 社交链接 ---
  [params.social]
    GitHub = "HangYaHan"
    Email = "18930093438@163.com"
    Bilibili = "19353940"
    RSS = true

  # --- 友链 / Friend links ---
  [[params.friends]]
    name = "示例友链一"
    url = "https://example.com"
    desc = "替换成你的朋友"
  [[params.friends]]
    name = "示例友链二"
    url = "https://example.org"
    desc = "再替换一个"

  # --- 文章页面 ---
  [params.page.share]
    enable = false
    X = false
    Threads = false
    Facebook = false
    Linkedin = false
    Whatsapp = false
    Pinterest = false
    Tumblr = false
    HackerNews = false
    Reddit = false
    VK = false
    Buffer = false
    Xing = false
    Line = false
    Instapaper = false
    Pocket = false
    Flipboard = false
    Weibo = false
    Blogger = false
    Baidu = false
    Odnoklassniki = false
    Evernote = false
    Skype = false
    Trello = false
    Diaspora = false
    Mix = false
    Telegram = false

# ============================================
#  多语言
# ============================================
[languages]
  [languages.zh-cn]
    weight = 1
    locale = "zh-CN"
    label = "简体中文"
    hasCJKLanguage = true
    [languages.zh-cn.params]
      [languages.zh-cn.params.home]
        rss = 10
        [languages.zh-cn.params.home.profile]
          enable = true
          avatarURL = "https://avatars.githubusercontent.com/u/168107882?v=4"
          title = ""
          subtitle = ""
          typeit = true
          social = true
      [languages.zh-cn.params.social]
        GitHub = "HangYaHan"
        Email = "18930093438@163.com"
        Bilibili = "19353940"
        RSS = true

# ============================================
#  Markup — 允许 raw HTML（工具页内嵌 HTML/JS）
# ============================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
