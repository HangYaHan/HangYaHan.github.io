# ============================================
#  基础设置 — 这些你必须自己改
# ============================================
baseURL = "https://hangyahan.github.io/"
title = "涵舍"
theme = "LoveIt"

# 默认语言 — 你的内容以中文为主
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
hasCJKLanguage = true                     # 中文/日文/韩文支持

enableRobotsTXT = true
enableEmoji = true

# ============================================
#  导航菜单 — 根据你的内容结构调整
# ============================================
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
  [[menu.main]]
    weight = 3
    identifier = "about"
    name = "About"
    url = "/about/"
  [[menu.main]]
    weight = 4
    identifier = "curated"
    name = "Curated"
    url = "/curated/"

# ============================================
#  LoveIt 主题参数
# ============================================
[params]
  defaultTheme = "auto"                    # 跟随系统明暗
  dateFormat = "2006-01-02"
  title = "涵舍"
  description = ""                         # ← 改：一句话描述你的网站

  # --- 作者 ---
  [params.author]
    name = "HangYaHan"                     # ← 改
    email = ""
    link = ""
    avatar = "https://avatars.githubusercontent.com/u/168107882?v=4"

  # --- 顶部导航栏 ---
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "涵舍"
      pre = ""
      post = ""
      typeit = false

  # --- 底部 ---
  [params.footer]
    enable = true
    hugo = false
    copyright = true
    author = true
    since = 2025                           # ← 改：你的建站年份
    icp = ""
    license = ""

  # --- 搜索（Fuse.js，不需要外部服务）---
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = ""
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = false

  # --- 文章列表页（/posts/） ---
  [params.section]
    paginate = 100                       # 52 篇文章一页全显示

  # --- 分类/标签列表页 ---
  [params.list]
    paginate = 50                        # 5 个分类一页全显示

  # --- 首页 ---
  [params.home]
    rss = 10
    # "Now" section — a one-line status update on the homepage
    # "此刻" — 首页的一行状态更新
    now = "📖 在读《共同基金常识》&nbsp;&nbsp;·&nbsp;&nbsp;🎓 准备秋招中"
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "https://avatars.githubusercontent.com/u/168107882?v=4"
      title = ""
      subtitle = ""                        # ← 改：首页副标题
      typeit = true
      social = true
      disclaimer = ""
    [params.home.posts]
      enable = true
      paginate = 6

  # --- 社交链接 ---
  [params.social]
    GitHub = "HangYaHan"
    Email = "18930093438@163.com"
    Bilibili = "19353940"
    RSS = true

  # --- 文章页面 ---
  [params.page.share]
    enable = false
    X = false
    Threads = false
    Facebook = false
    Linkedin = false
    Whatsapp = false
    Pinterest = false
    Tumblr = false
    HackerNews = false
    Reddit = false
    VK = false
    Buffer = false
    Xing = false
    Line = false
    Instapaper = false
    Pocket = false
    Flipboard = false
    Weibo = false
    Blogger = false
    Baidu = false
    Odnoklassniki = false
    Evernote = false
    Skype = false
    Trello = false
    Diaspora = false
    Mix = false
    Telegram = false

# ============================================
#  多语言
# ============================================
[languages]
  [languages.zh-cn]
    weight = 1
    locale = "zh-CN"
    label = "简体中文"
    hasCJKLanguage = true
    [languages.zh-cn.params]
      [languages.zh-cn.params.home]
        rss = 10
        [languages.zh-cn.params.home.profile]
          enable = true
          avatarURL = "https://avatars.githubusercontent.com/u/168107882?v=4"
          title = ""
          subtitle = ""
          typeit = true
          social = true
      [languages.zh-cn.params.social]
        GitHub = "HangYaHan"
        Email = "18930093438@163.com"
        Bilibili = "19353940"
        RSS = true
